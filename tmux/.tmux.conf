###########################
#  Configuration
###########################

# use 256 term for pretty colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0]]
set -g allow-passthrough on  # allow escape sequences (eg. colour scheme changes) to pass through to terminal

# increase scroll-back history
set -g history-limit 5000

# use vim key bindings
setw -g mode-keys vi

# mouse is on by default from tmux 3.8

set-option -g focus-events on

# decrease command delay (increases vim responsiveness)
set -sg escape-time 1

# increase repeat time for repeatable commands
set -g repeat-time 1000

# start window index at 1
set -g base-index 1

# start pane index at 1
setw -g pane-base-index 1

# highlight window when it has new activity
setw -g monitor-activity on
set -g visual-activity on

# re-number windows when one is closed
set -g renumber-windows on

###########################
#  Key Bindings
###########################

# tmux prefix
unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix
# bind-key -n C-b send-prefix

bind -Tcopy-mode-vi v send -X begin-selection
bind -Tcopy-mode-vi V send -X select-line
bind -Tcopy-mode-vi C-v send -X rectangle-toggle \; send -X begin-selection
bind -Tcopy-mode-vi y send -X copy-selection-and-cancel
bind -Tcopy-mode-vi Escape send -X cancel

# paste
# unbind C-p
# bind C-p paste-buffer

# # window splitting
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

# # quickly switch panes
# unbind ^J
# bind ^J select-pane -t :.+

# force a reload of the config file
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

unbind w
bind w set-window-option synchronize-panes\; display-message "Synchronising: #{?pane_synchronized,on,off}"


###########################
# Status Bar
###########################
# use the terminal's ANSI palette so Omarchy theme switches carry through
set -g theme terminal

set -g status-position bottom
set -g status-justify left
# bar background is the terminal's own; the window list sits on a grey (ANSI black) band
set -g status-style "bg=default,fg=white"
set -g status-left-length 40
set -g status-right-length 80
set -g window-status-separator ""

# staticky edges, like the nvim statusline: 3 to 6 sextant characters per edge,
# fading from dense to sparse, picked afresh each time this file is sourced
run-shell 'sh ~/.tmux-static.sh'

# session block: blue, breaking up into the grey band
set -g status-left "#[bg=blue,fg=black,bold] #S #[bg=black,fg=blue,nobold]#{@static_session}"
# right side: magenta user@host, then green date and time, each breaking in from the left
set -g status-right "#[bg=default,fg=magenta]#{@static_userhost}#[bg=magenta,fg=black] $USER@#h #[bg=magenta,fg=green]#{@static_datetime}#[bg=green,fg=black] %Y-%m-%d %I:%M:%S %p "
set -g status-interval 1
# the last window breaks the grey band up into the terminal background
set -g window-status-format "#[bg=black,fg=white] #I #W #{?window_end_flag,#[bg=default#,fg=black]#{@static_band},}"
# selected window: Catppuccin Mocha mauve, fixed hex
set -g window-status-current-format "#[bg=#cba6f7,fg=black] #I #W #{?window_end_flag,#[bg=default#,fg=black]#{@static_band},}"
# tmux 3.8 underlines the current window by default
set -g window-status-current-style default

###########################
# tmux 3.8 features
###########################
# fuzzy switchers
bind s switch-mode -s
bind W switch-mode -w

# throwaway overlays, click outside to close (btop also closes on Escape)
bind g new-pane -O -C -x 90% -y 90% lazygit
bind T new-pane -O -C -D -x 80% -y 80% btop

# relative line numbers in copy mode, like nvim
set -g copy-mode-line-numbers relative

# scrollbars that only appear while scrolling
set -g pane-scrollbars auto-hide

setw -g aggressive-resize on

bind -n M-l select-pane -L
bind -n M-h select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

if-shell "uname | grep -q Darwin" 'source-file ~/.tmux-macos.conf' 'source-file ~/.tmux-linux.conf'

# ask before killing a window or session (Omarchy binds k and K with no confirmation)
bind -N "Kill window" k confirm-before -p "kill-window #W? (y/n)" kill-window
bind -N "Kill session" K confirm-before -p "kill-session #S? (y/n)" kill-session

###########################
# Plugins
###########################
set -g @plugin 'tmux-plugins/tpm'

# keep TPM initialisation at the very bottom of this file
run '~/.config/tmux/plugins/tpm/tpm'
